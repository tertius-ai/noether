[package]
name = "noether-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
description = "Private PyO3 transport for the Noether Python package"
repository = "https://github.com/tertius-ai/noether"
build = "build.rs"

[lib]
name = "noether_python"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]
abi3-py310 = ["pyo3/abi3-py310"]
msolve-subprocess = [
    "dep:noether-bridges",
    "noether/msolve-subprocess",
    "noether-bridges/msolve-subprocess",
]
macaulay2-subprocess = [
    "dep:noether-bridges",
    "noether/macaulay2-subprocess",
    "noether-bridges/macaulay2-subprocess",
]
singular-subprocess = [
    "dep:noether-bridges",
    "noether/singular-subprocess",
    "noether-bridges/singular-subprocess",
]
distributed = ["noether/distributed"]

[dependencies]
noether.workspace = true
pyo3.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
noether-bridges = { workspace = true, optional = true }
