[graph]
all-features = true

[advisories]
ignore = [
    # rsmpi 0.8.2 still uses `conv` for checked integer conversions; `conv`
    # alone pulls the unmaintained macro crate. This is not a vulnerability,
    # no safe upgrade exists, and m4rst-distributed cannot replace the active
    # system-MPI binding at release time. `scripts/audit-dependencies.sh`
    # separately pins the allowed reverse-dependency path so this exception
    # cannot silently spread to another retained dependency.
    { id = "RUSTSEC-2025-0058", reason = "custom_derive is an unavoidable transitive build dependency of maintained rsmpi 0.8.2" },
]
unused-ignored-advisory = "deny"

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
# All workspace crates are unpublished and intentionally use path-only
# dependencies on one another. Registry dependencies remain versioned by Cargo.
wildcards = "allow"
highlight = "all"
skip = [
    # bindgen 0.72 retains shlex 1 while cc 1.4 has moved to shlex 2. Both are
    # build-only dependencies in the MPI/FLINT binding graph.
    { crate = "shlex@1.3.0", reason = "temporary upstream build-tool split between bindgen and cc" },
    # PyO3 and serde still use syn 2; schemars 1.2 has moved to syn 3.
    { crate = "syn@2.0.117", reason = "temporary upstream proc-macro ecosystem split" },
    # tempfile/getrandom expose two target-only WASI generations on non-WASI hosts.
    { crate = "wit-bindgen@0.51.0", reason = "temporary upstream WASI generation split" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
