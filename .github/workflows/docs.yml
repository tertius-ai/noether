name: documentation

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "docs/**"
      - "examples/**"
      - "python/**"
      - "crates/noether/**"
      - "crates/noether-python/**"
      - "mkdocs.yml"
      - "scripts/gen_*"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - "examples/**"
      - "python/**"
      - "crates/noether/**"
      - "crates/noether-python/**"
      - "mkdocs.yml"
      - "scripts/gen_*"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      RUSTC_WRAPPER: "sccache"
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: "noether-docs-v1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install native build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            autoconf automake build-essential clang libclang-dev libopenmpi-dev \
            libtool pkg-config libgmp-dev libmpfr-dev

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Rust toolchain
        run: rustup show

      - name: Configure Rust compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.17.0"

      - name: Fingerprint the native toolchain
        id: native-toolchain
        run: |
          compiler=$(cc --version | sha256sum | cut -d' ' -f1)
          echo "compiler=$compiler" >> "$GITHUB_OUTPUT"

      - name: Cache FLINT
        id: flint-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .deps/flint
          key: flint-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-toolchain.outputs.compiler }}-${{ hashFiles('scripts/install-flint.sh') }}

      - name: Build FLINT
        if: steps.flint-cache.outputs.cache-hit != 'true'
        run: scripts/install-flint.sh

      - name: Save FLINT
        if: steps.flint-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .deps/flint
          key: flint-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-toolchain.outputs.compiler }}-${{ hashFiles('scripts/install-flint.sh') }}

      - name: Build unified documentation
        run: |
          echo "FLINT_PREFIX=${{ github.workspace }}/.deps/flint" >> "$GITHUB_ENV"
          export FLINT_PREFIX="${{ github.workspace }}/.deps/flint"
          uv sync --locked --group dev --group validation
          make engine
          make docs

      - name: Configure Pages
        if: github.event.repository.private == false
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        if: github.event.repository.private == false
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: target/noether-docs

      - name: Retain the private-repository documentation build
        if: github.event.repository.private
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: noether-docs-${{ github.sha }}
          path: target/noether-docs
          if-no-files-found: error

  deploy:
    if: >-
      github.event.repository.private == false &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
