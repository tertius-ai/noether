name: unpublished container candidates

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Container profile to build and audit
        required: true
        default: all
        type: choice
        options:
          - all
          - cpu
          - mpi

permissions:
  contents: read

concurrency:
  group: container-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cpu-and-mpi:
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(inputs.profile == 'all' && '["cpu","mpi"]' || format('["{0}"]', inputs.profile)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build and audit the exact image
        env:
          NOETHER_IMAGE_REPOSITORY: ghcr.io/tertius-ai/noether
          NOETHER_PROFILE: ${{ matrix.profile }}
        run: |
          set -o pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml | head -n 1)
          mkdir -p target/container-candidate
          report="target/container-candidate/$NOETHER_PROFILE.txt"
          scripts/build-images.sh "$NOETHER_PROFILE"
          scripts/check-image.sh \
            "$NOETHER_PROFILE" \
            "ghcr.io/tertius-ai/noether:$version-$NOETHER_PROFILE" \
            | tee "$report"
          test -s "$report"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: noether-${{ matrix.profile }}-container-candidate-${{ github.sha }}
          path: target/container-candidate
          if-no-files-found: error
