[package]
license.workspace = true
name = "lattice-enum"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Exact short-vector and closest-vector enumeration over positive-definite integral Gram matrices."
publish = false
repository = "https://github.com/tertius-ai/noether"
readme = "README.md"
build = "build.rs"

[features]
default = []
# Opt-in top-level pruning-subtree parallelism via Rayon. The default stays
# serial and dependency light.
parallel = ["dep:rayon"]

[dependencies]
rayon = { version = "1", optional = true }
# Exact integer/rational substrate for the certified GSO and search geometry.
flint-core.workspace = true

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true

[[bench]]
name = "kernel"
harness = false

[build-dependencies]
tertius-build.workspace = true
